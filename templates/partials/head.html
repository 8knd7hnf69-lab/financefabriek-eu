<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{page.title}}</title>
<meta name="description" content="{{page.description}}">
<link rel="canonical" href="{{site}}{{page.url}}">
<link rel="icon" href="/images/favicon.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{bedrijf.naam}}">
<meta property="og:title" content="{{page.title}}">
<meta property="og:description" content="{{page.description}}">
<meta property="og:url" content="{{site}}{{page.url}}">
<meta property="og:image" content="{{site}}{{page.image}}">
<script type="application/ld+json">{{{page.jsonld}}}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quando&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* EU-e-commerce-site, zelfde huisstijl als financefabriek.nl. Layout: een productielijn — het document loopt van links naar rechts door de fabriek, daarna diensten, CFO-blokken, contact. */
:root{
  --brown:#4D3708;       /* merkkleur */
  --amber:#FFB81C;       /* merkkleur */
  --brown-deep:#2B1F04;
  --bg:#FFFFFF;
  --surface:#FBF7EE;
  --ink:#2B1F04;
  --muted:#6B5C40;
  --line:#E7DDC7;
  --accent:#4D3708;
  --accent-ink:#FFFFFF;
  --signal:#FFB81C;
  --soft:#F6EEDB;
  --f-display:"Quando",Georgia,"Times New Roman",serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --maxw:1120px;
  --r:6px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17120A;--surface:#211A0E;--ink:#F4ECDB;--muted:#BCAE90;--line:#3A2F19;
  --accent:#FFB81C;--accent-ink:#2B1F04;--signal:#FFB81C;--soft:#2A2111;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17120A;--surface:#211A0E;--ink:#F4ECDB;--muted:#BCAE90;--line:#3A2F19;
  --accent:#FFB81C;--accent-ink:#2B1F04;--signal:#FFB81C;--soft:#2A2111;color-scheme:dark}

*{box-sizing:border-box}
img{max-width:100%}
html{scroll-behavior:smooth}
[id]{scroll-margin-top:calc(env(safe-area-inset-top,0px) + 84px)}
body{background:var(--bg);color:var(--ink);font:400 1rem/1.6 var(--f-body);margin:0}
.wrap{max-width:var(--maxw);margin-inline:auto;padding-inline:clamp(16px,4vw,40px)}
h1,h2,h3{font-family:var(--f-display);font-weight:400;line-height:1.12;letter-spacing:-.005em;text-wrap:balance;margin:0}
h1{font-size:clamp(2.2rem,5.4vw,3.9rem)}
h2{font-size:clamp(1.6rem,3.4vw,2.4rem)}
h3{font-size:1.15rem}
p{margin:0;max-width:62ch}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:2px}
.label{font:500 .74rem/1.2 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:.5em;font:600 .95rem/1 var(--f-body);padding:.9em 1.3em;border-radius:var(--r);text-decoration:none;border:1.5px solid var(--accent);cursor:pointer}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn:hover{filter:brightness(1.08)}

/* nav */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--brown);border-bottom:1px solid rgba(255,184,28,.18)}
header.top .nav ul a{color:#E9DFC9}
header.top .nav ul a:hover{color:var(--amber)}
header.top .btn-primary{background:var(--amber);border-color:var(--amber);color:var(--brown-deep)}
.nav{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding-block:.85rem}
.logo{display:block;line-height:0}
.logo img{height:46px;width:auto;display:block}
.nav ul{display:flex;gap:1.6rem;list-style:none;margin:0;padding:0;font-size:.93rem}
.nav ul a{text-decoration:none;color:var(--muted)}
.nav ul a:hover{color:var(--ink)}
@media (max-width:820px){.nav ul{display:none}}
.nav-right{display:flex;align-items:center;gap:.9rem}
.lang-switch{font:500 .8rem/1 var(--f-mono);letter-spacing:.08em;color:#E9DFC9;text-decoration:none;border:1px solid rgba(233,223,201,.45);border-radius:var(--r);padding:.55em .7em}
.lang-switch:hover{color:var(--amber);border-color:var(--amber)}

/* hero */
.hero-band{background:linear-gradient(0deg,rgba(26,18,2,.88) 0%,rgba(26,18,2,.45) 40%,rgba(26,18,2,0) 72%),linear-gradient(90deg,rgba(26,18,2,.6) 0%,rgba(26,18,2,0) 60%),var(--hero-img) center 40%/cover no-repeat,var(--brown);color:#FFFFFF}
.hero-band .label{color:#FFFFFF;text-shadow:0 1px 10px rgba(20,14,2,.7)}
.hero-band .lead{color:#FFFFFF}
.hero-band h1,.hero-band .lead{text-shadow:0 2px 18px rgba(20,14,2,.55)}
.hero-band .btn-primary{background:var(--amber);border-color:var(--amber);color:var(--brown-deep)}
.hero-band .btn-ghost{color:#FFFFFF;border-color:#FFFFFF;background:rgba(26,18,2,.35)}
.hero-band .dash-foot{color:#D8CBAE}
.hero-band .live{color:var(--amber)}
.hero-band .live i{background:var(--amber)}
.hero{padding-block:clamp(3rem,8vw,6rem) clamp(2.5rem,6vw,4.5rem);display:grid;grid-template-columns:minmax(0,44rem);min-height:clamp(520px,82vh,800px);align-content:end}
.hero>*{min-width:0}
.hero h1 em{font-style:normal;color:#FFFFFF}
.hero .lead{font-size:1.15rem;margin-top:1.4rem}
.hero .cta{display:flex;flex-wrap:wrap;gap:.8rem;margin-top:2rem}
@media (max-width:880px){.hero{grid-template-columns:1fr}}

/* dashboard mock */
.dash{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:1.3rem;box-shadow:0 18px 40px -24px rgba(12,40,50,.35)}
.dash-head{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin-bottom:1rem}
.live{display:inline-flex;align-items:center;gap:.4rem;font:500 .72rem var(--f-mono);color:var(--accent)}
.live i{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.25}}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
.kpi{background:var(--soft);border-radius:var(--r);padding:.75rem .85rem}
.kpi b{display:block;font:600 1.3rem/1.2 var(--f-mono);font-variant-numeric:tabular-nums;margin-top:.25rem}
.kpi small{font:400 .72rem var(--f-mono);color:var(--muted)}
.spark{margin-top:1rem}
.spark svg{width:100%;height:auto;display:block}
.dash-foot{margin-top:.8rem;font:400 .72rem var(--f-mono);color:var(--muted)}

.shot{margin:0;display:grid;gap:.8rem}
.shot img{width:100%;height:auto;border-radius:10px;display:block;box-shadow:0 18px 40px -24px rgba(12,40,50,.45)}
.shot .dash-foot{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;margin:0}

/* productielijn */
.line-sec{border-block:1px solid var(--line);background:var(--surface);padding-block:clamp(3rem,7vw,5rem)}
.sec-head{display:grid;gap:.9rem;margin-bottom:2.5rem}
.sec-head p{color:var(--muted);font-size:1.05rem}
.stations{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);position:relative;gap:0}
.stations::before{content:"";position:absolute;left:0;right:0;top:27px;height:2px;background:repeating-linear-gradient(90deg,var(--line) 0 10px,transparent 10px 16px)}
.token{position:absolute;top:21px;left:0;width:14px;height:14px;border-radius:3px;background:var(--signal);animation:run 9s linear infinite}
@keyframes run{0%{left:0}100%{left:calc(100% - 14px)}}
.station{position:relative;padding-right:1.4rem;display:grid;gap:.55rem;min-width:0}
.st-no{width:56px;height:56px;border-radius:50%;background:var(--surface);border:2px solid var(--accent);display:grid;place-items:center;font:500 .95rem var(--f-mono);color:var(--accent);position:relative;z-index:1;margin-bottom:.6rem}
.station p{color:var(--muted);font-size:.95rem}
@media (max-width:820px){
  .stations{grid-template-columns:1fr;gap:1.6rem}
  .stations::before{left:27px;right:auto;top:0;bottom:0;width:2px;height:auto;background:repeating-linear-gradient(180deg,var(--line) 0 10px,transparent 10px 16px)}
  .token{left:21px;top:0;animation:runv 9s linear infinite}
  @keyframes runv{0%{top:0}100%{top:calc(100% - 14px)}}
  .station{grid-template-columns:56px 1fr;column-gap:1.1rem;padding-right:0}
  .st-no{grid-row:span 2;margin:0}
}
@media (prefers-reduced-motion:reduce){.token,.live i{animation:none}}

.extras{display:grid;grid-template-columns:1.1fr .9fr;gap:clamp(1.2rem,3vw,2rem);margin-top:3rem;align-items:center}
.extras-text{display:grid;gap:1rem;min-width:0}
.extras .shot{min-width:0}
.extras .dash-foot{color:var(--muted)}
.extras-text>div{background:var(--soft);border-radius:var(--r);padding:1.4rem;display:grid;gap:.5rem;align-content:start;min-width:0}
.extras p:not(.label){color:var(--muted);font-size:.95rem}
@media (max-width:720px){.extras{grid-template-columns:1fr}}
.price{font:600 2.4rem/1 var(--f-mono);font-variant-numeric:tabular-nums}
.price small{font:400 .85rem var(--f-body);color:var(--muted);margin-left:.3rem}

.split{display:grid;grid-template-columns:1.1fr .9fr;gap:clamp(1.5rem,4vw,3rem);align-items:center;margin-bottom:2.5rem}
.split>*{min-width:0}
.split .sec-head{margin-bottom:0}
.photo{display:block;width:100%;height:auto;max-width:100%;border-radius:8px;object-fit:cover}
.split .photo{aspect-ratio:4/3}
@media (max-width:820px){.split{grid-template-columns:1fr}.split .photo{aspect-ratio:16/9}}
.band{background:linear-gradient(90deg,rgba(43,31,4,.9),rgba(43,31,4,.45)),var(--band-img) center/cover no-repeat,var(--brown-deep);color:#FFFFFF;padding-block:clamp(4rem,10vw,7rem)}
.band p{font-family:var(--f-display);font-size:clamp(1.6rem,3.8vw,2.8rem);line-height:1.2;max-width:22ch;text-wrap:balance}
.band span{color:var(--amber)}
.cfo-side{display:grid;gap:1.6rem;min-width:0}

/* diensten */
.extra-head{display:grid;gap:.7rem;margin:3.5rem 0 1.4rem}
.extra-head p:not(.label){font:400 clamp(1.1rem,2vw,1.3rem)/1.5 var(--f-display);max-width:52ch}
.services{padding-block:clamp(3rem,7vw,5rem)}
.svc-grid{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-left:1px solid var(--line)}
.svc{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:1.5rem 1.4rem 1.6rem;display:grid;gap:.6rem;align-content:start;min-width:0}
.svc .code{font:500 .72rem var(--f-mono);letter-spacing:.08em;color:var(--accent)}
.svc p{color:var(--muted);font-size:.95rem}
@media (max-width:880px){.svc-grid{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.svc-grid{grid-template-columns:1fr}}

/* cfo */
.cfo{background:var(--amber);color:var(--brown-deep);padding-block:clamp(3rem,7vw,5rem)}
.cfo .label{color:var(--brown)}
.cfo-grid{display:grid;grid-template-columns:1fr 1fr;gap:clamp(2rem,5vw,4rem);align-items:center}
.cfo-grid>*{min-width:0}
.cfo p{color:#4A3A17;margin-top:1.1rem}
.cfo ul{margin:1.4rem 0 0;padding:0;list-style:none;display:grid;gap:.55rem}
.cfo li{display:flex;gap:.7rem;align-items:baseline}
.cfo li::before{content:"";flex:none;width:8px;height:8px;background:var(--brown);transform:translateY(-1px)}
.blocks{display:grid;gap:.9rem}
.blocks .row{display:grid;grid-template-columns:5.5rem 1fr;gap:1rem;align-items:center}
.blocks .h{font:600 1.1rem var(--f-mono);font-variant-numeric:tabular-nums}
.bar{display:flex;gap:4px;flex-wrap:wrap}
.bar span{width:18px;height:18px;border-radius:2px;background:var(--brown)}
.blocks small{font:400 .75rem var(--f-mono);color:#4A3A17}
@media (max-width:880px){.cfo-grid{grid-template-columns:1fr}}

/* reviews */
.reviews{background:linear-gradient(180deg,rgba(26,18,2,.82) 0%,rgba(26,18,2,.55) 45%,rgba(26,18,2,.8) 100%),var(--reviews-img) center/cover no-repeat,var(--brown-deep);color:#FFFFFF;padding-block:clamp(4rem,9vw,6.5rem)}
.reviews .label{color:#FFFFFF}
.reviews .sec-head p{color:#F1E8D4}
.reviews h2{color:#FFFFFF}
.review-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(1rem,2.5vw,1.6rem)}
.review{margin:0;background:var(--bg);color:var(--ink);border-radius:10px;padding:1.5rem 1.5rem 1.4rem;display:flex;flex-direction:column;min-width:0;box-shadow:0 20px 40px -24px rgba(0,0,0,.6)}
.review-q{color:var(--amber);font:400 3.6rem/.8 var(--f-display);height:2rem}
.review blockquote{margin:0;padding-top:.6rem;font:400 1.08rem/1.5 var(--f-display);flex:1}
.review figcaption{display:grid;gap:.15rem;border-top:1px dashed var(--line);margin-top:1.2rem;padding-top:1rem}
.review figcaption b{font-weight:600}
.review figcaption span{color:var(--muted);font-size:.9rem}
@media (max-width:880px){.review-grid{grid-template-columns:1fr}}

/* voor wie + abonnement */
.fit{padding-block:clamp(3rem,7vw,5rem);display:grid;grid-template-columns:1fr 1fr;gap:clamp(2rem,5vw,4rem)}
.fit>*{min-width:0}
.who{display:grid;gap:0;margin-top:1.6rem;border-top:1px solid var(--line)}
.who div{display:grid;grid-template-columns:9rem 1fr;gap:1rem;padding-block:1rem;border-bottom:1px solid var(--line)}
.who b{font-family:var(--f-display);font-weight:400}
.who span{color:var(--muted)}
.note{margin-top:1rem;font-size:.9rem;color:var(--muted)}
.sub{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:clamp(1.4rem,3vw,2rem);display:grid;gap:1rem;align-content:start}
.sub p{color:var(--muted)}
.sub dl{margin:0;display:grid;gap:.7rem}
.sub dl div{display:flex;justify-content:space-between;gap:1rem;border-bottom:1px dashed var(--line);padding-bottom:.6rem}
.sub dt{color:var(--muted)}
.sub dd{margin:0;font-weight:600;text-align:right}
@media (max-width:880px){.fit{grid-template-columns:1fr}}
@media (max-width:480px){.who div{grid-template-columns:1fr;gap:.2rem}}

/* contact */
.contact{border-top:1px solid var(--line);background:var(--surface);padding-block:clamp(3rem,7vw,5rem)}
.contact-grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:clamp(2rem,5vw,4rem)}
.contact-grid>*{min-width:0}
form{display:grid;gap:1rem}
.two{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
@media (max-width:560px){.two{grid-template-columns:1fr}}
label{display:grid;gap:.35rem;font-size:.88rem;font-weight:500}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:.75rem .85rem;width:100%}
textarea{min-height:120px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.form-msg{font-size:.92rem;color:var(--accent);min-height:1.4em}
.hp{position:absolute;left:-9999px}
@media (max-width:880px){.contact-grid{grid-template-columns:1fr}}

footer{padding-block:2rem;font-size:.85rem;color:var(--muted)}
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:1rem;border-top:1px solid var(--line);padding-top:1.5rem}

/* dienstkaarten als link */
a.svc{text-decoration:none;color:inherit;transition:background .15s}
a.svc:hover{background:var(--soft)}
a.svc .more{font-weight:600;font-size:.9rem;color:var(--accent);margin-top:.2rem}
.cfo-more{display:inline-block;margin-top:1.4rem;font-weight:600;color:var(--brown-deep)}

/* dienstpagina */
.page-hero{background:linear-gradient(90deg,rgba(26,18,2,.9) 0%,rgba(26,18,2,.7) 55%,rgba(26,18,2,.45) 100%),var(--page-img) center/cover no-repeat,var(--brown);color:#FFFFFF;padding-block:clamp(3rem,7vw,5.5rem)}
.page-hero .wrap{display:grid;gap:1rem}
.page-hero .label{color:var(--amber)}
.page-hero h1{color:#FFFFFF}
.page-hero .lead{color:#FFFFFF;font-size:1.15rem;max-width:60ch;text-shadow:0 2px 14px rgba(20,14,2,.5)}
.page-hero .cta{margin-top:.8rem}
.page-hero .btn-primary{background:var(--amber);border-color:var(--amber);color:var(--brown-deep)}
.crumbs{display:flex;flex-wrap:wrap;gap:.5rem;font:400 .8rem var(--f-mono);color:#E9DFC9;margin-bottom:.4rem}
.crumbs a{color:#E9DFC9;text-decoration:none}
.crumbs a:hover{color:var(--amber)}
.svc-page{display:grid;grid-template-columns:1.5fr 1fr;gap:clamp(2rem,5vw,4rem);padding-block:clamp(3rem,7vw,5rem);align-items:start}
.svc-page>*{min-width:0}
.points{list-style:none;margin:1.4rem 0 0;padding:0;display:grid;gap:0;border-top:1px solid var(--line)}
.points li{display:flex;gap:.9rem;align-items:baseline;padding-block:.9rem;border-bottom:1px solid var(--line)}
.points li::before{content:"";flex:none;width:9px;height:9px;background:var(--amber);transform:translateY(-1px)}
.note{margin-top:2rem;background:var(--soft);border-radius:var(--r);padding:1.3rem 1.4rem;display:grid;gap:.5rem}
.svc-side{display:grid;gap:1.4rem;position:sticky;top:calc(env(safe-area-inset-top,0px) + 96px)}
.side-card{background:var(--brown);color:#FFFFFF;border-radius:10px;padding:1.5rem;display:grid;gap:.8rem}
.side-card h3{color:#FFFFFF}
.side-card p{color:#E9DFC9}
.side-card .btn-primary{background:var(--amber);border-color:var(--amber);color:var(--brown-deep);justify-self:start}
.side-card .side-mail{font:400 .85rem var(--f-mono);color:#E9DFC9;user-select:all}
.side-list ul{list-style:none;margin:.7rem 0 0;padding:0;display:grid}
.side-list a{display:block;padding:.55rem 0;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.side-list a:hover{color:var(--accent)}
@media (max-width:880px){.svc-page{grid-template-columns:1fr}.svc-side{position:static}}

/* internationaal */
.logo-wrap{display:flex;align-items:center;gap:.7rem;text-decoration:none}
.intl-tag{font:500 .68rem/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--brown-deep);background:var(--amber);padding:.4em .55em;border-radius:3px}
@media (max-width:480px){.intl-tag{display:none}}
.onestop{padding-block:clamp(3rem,7vw,5rem)}
.onestop .split{margin-bottom:0}
.onestop ul{list-style:none;margin:1.2rem 0 0;padding:0;display:grid;gap:.55rem}
.onestop li{display:flex;gap:.7rem;align-items:baseline}
.onestop li::before{content:"";flex:none;width:8px;height:8px;background:var(--amber);transform:translateY(-1px)}
.stations.five{grid-template-columns:repeat(5,1fr)}
@media (max-width:820px){.stations.five{grid-template-columns:1fr}}
.svc-grid.plain .svc{background:transparent}
.bv{padding-block:clamp(3rem,7vw,5rem);display:grid;grid-template-columns:.8fr 1.2fr;gap:clamp(2rem,5vw,4rem);align-items:start}
.bv>*{min-width:0}
.bv .sec-head{margin-bottom:0}
.facts{margin:0;border-top:1px solid var(--line)}
.facts div{display:grid;grid-template-columns:12rem 1fr;gap:1rem;padding-block:.95rem;border-bottom:1px solid var(--line)}
.facts dt{font-family:var(--f-display)}
.facts dd{margin:0;color:var(--muted)}
.bv .note{margin-top:1.4rem}
@media (max-width:880px){.bv{grid-template-columns:1fr}}
@media (max-width:520px){.facts div{grid-template-columns:1fr;gap:.2rem}}
.pricing{background:var(--amber);color:var(--brown-deep);padding-block:clamp(3rem,7vw,5rem)}
.pricing .label{color:var(--brown)}
.price-grid{display:grid;grid-template-columns:1fr 1fr;gap:clamp(1rem,2.5vw,1.6rem)}
.price-card{background:#FFFFFF;color:#2B1F04;border-radius:10px;padding:clamp(1.4rem,3vw,2rem);display:grid;gap:.9rem;align-content:start;min-width:0}
.price-card .price{color:#2B1F04;font:400 clamp(1.7rem,3vw,2.1rem)/1.1 var(--f-display);display:flex;flex-wrap:wrap;align-items:baseline;gap:.2rem .5rem}
.price-card .price small{color:#6B5C40}
.price-card p{color:#6B5C40}
.price-card ul{list-style:none;margin:0;padding:0;display:grid;gap:.5rem;border-top:1px dashed #E7DDC7;padding-top:.9rem}
.price-card li{display:flex;gap:.7rem;align-items:baseline}
.price-card li::before{content:"";flex:none;width:8px;height:8px;background:#4D3708;transform:translateY(-1px)}
@media (max-width:760px){.price-grid{grid-template-columns:1fr}}
.faq{padding-block:clamp(3rem,7vw,5rem)}
.faq-list{border-top:1px solid var(--line);max-width:52rem}
.faq details{border-bottom:1px solid var(--line)}
.faq summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:1rem;padding-block:1.1rem;font:400 1.1rem/1.4 var(--f-display)}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font:500 1.3rem/1 var(--f-mono);color:var(--accent);flex:none}
.faq details[open] summary::after{content:"\2212"}
.faq details p{padding-bottom:1.2rem;color:var(--muted)}
.foot a{color:inherit}
.guides{padding-block:clamp(3rem,7vw,5rem) 0}
.svc-grid.two{grid-template-columns:repeat(2,1fr)}
@media (max-width:640px){.svc-grid.two{grid-template-columns:1fr}}
.article{display:grid;gap:0}
.article h2{font-size:clamp(1.25rem,2.4vw,1.5rem);margin-top:2rem}
.article h2:first-child{margin-top:0}
.article p{margin-top:.7rem;color:var(--ink);max-width:62ch}

.booking{margin-top:1.6rem;background:var(--soft);border-radius:8px;padding:1.2rem 1.3rem;display:grid;gap:.6rem;justify-items:start}
.booking-title{font-family:var(--f-display);font-size:1.1rem}
.booking p:not(.booking-title){color:var(--muted)}
.side-book{color:var(--amber);font-weight:600;text-decoration:none}
.side-book:hover{text-decoration:underline}
.svc-grid>:last-child:nth-child(3n+1){grid-column:1/-1}
.svc-grid.two>:last-child:nth-child(3n+1){grid-column:auto}
.svc-grid.two>:last-child:nth-child(2n+1){grid-column:1/-1}
@media (max-width:880px){.svc-grid>:last-child:nth-child(3n+1){grid-column:auto}.svc-grid>:last-child:nth-child(2n+1){grid-column:1/-1}}
@media (max-width:560px){.svc-grid>:last-child{grid-column:auto}}
.nav ul a,.nav .btn,.intl-tag,.lang-switch{white-space:nowrap}
@media (max-width:1100px){.nav ul{gap:1rem;font-size:.88rem}}
@media (max-width:960px){.nav ul{display:none}}
</style>

</head>
