<footer class="wrap">
  <div class="foot">
    <span>© {{@year}} {{bedrijf.naam}} · {{footer.part_of}} (<a href="{{footer.main_site_url}}">{{footer.main_site}}</a>)</span>
    <span>CoC {{bedrijf.kvk}} · VAT {{bedrijf.btw}} · <a href="mailto:{{contact.email}}">{{contact.email}}</a></span>
  </div>
</footer>

<script>
document.getElementById('contactForm').addEventListener('submit', async function (e) {
  e.preventDefault();
  var msg = document.getElementById('formMsg');
  if (/claude/.test(location.hostname) || location.protocol === 'file:') {
    msg.textContent = '{{form.msg_preview}}';
    return;
  }
  try {
    var body = new URLSearchParams(new FormData(this)).toString();
    var r = await fetch('/', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: body });
    if (!r.ok) throw new Error();
    this.reset();
    msg.textContent = '{{form.msg_success}}';
  } catch (err) {
    msg.textContent = '{{form.msg_error}} {{contact.email}}.';
  }
});
</script>

<script>
(function(){
  var a=document.getElementById('dff-wa');if(!a)return;
  var T={"nl": "Hallo De Finance Fabriek, ik heb een vraag over verkopen in de EU.", "en": "Hi De Finance Fabriek, I have a question about selling in the EU with a Dutch BV."};
  function lang(){
    var v=document.querySelector('.pv:not([hidden])[lang]');
    var l=(v&&v.getAttribute('lang'))||document.documentElement.getAttribute('lang')||(/^\/en(\/|$)/.test(location.pathname)?'en':'nl');
    return l.slice(0,2).toLowerCase()==='en'?'en':'nl';
  }
  function upd(){
    var l=lang();
    a.href='https://wa.me/31850471046?text='+encodeURIComponent(T[l]);
    var lbl=l==='en'?'Chat with us on WhatsApp':'Chat met ons via WhatsApp';
    a.setAttribute('aria-label',lbl);a.title=lbl;
  }
  upd();
  a.addEventListener('pointerdown',upd);a.addEventListener('focus',upd);a.addEventListener('click',upd);
  document.addEventListener('click',function(){setTimeout(upd,0);});
  window.addEventListener('popstate',upd);
})();
</script>
